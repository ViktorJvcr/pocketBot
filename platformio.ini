[env:esp32c3_zero]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; Скорость монитора порта
monitor_speed = 115200

; Настройки памяти для C3 Zero (4MB Flash)
board_build.flash_mode = dio
board_upload.flash_size = 4MB

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43

build_flags =
    -DBOARD_C3_POCKET=1
    ; --- Включаем USB Serial на ESP32-C3 ---
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; --- Отключаем встроенный RGB-светодиод на GPIO 8 или 10, чтобы не мешал I2C! ---
    -URGB_BUILTIN
    ; --- Настройки TFT_eSPI для ST7735 80x160 ---
    -DUSER_SETUP_LOADED=1
    -DST7735_DRIVER=1
    -DTFT_WIDTH=80
    -DTFT_HEIGHT=160
    ; Таб-настройка матрицы (если цвета будут инвертированы или со смещением, поменяем на GREENTAB160x80 или BLACKTAB)
    -DST7735_REDTAB160x80=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_ON=1
    ; Пины SPI экрана
    -DTFT_MISO=-1
    -DTFT_MOSI=7
    -DTFT_SCLK=6
    -DTFT_CS=5
    -DTFT_DC=4
    -DTFT_RST=3
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=27000000
